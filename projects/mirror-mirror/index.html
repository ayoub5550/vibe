<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Mirror Mirror — music video</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/three.min.js"></script>
    <style>
      @font-face { font-family: "Big Shoulders Display"; src: url("fonts/BigShoulders-900.woff2") format("woff2"); font-weight: 900; font-display: block; }
      @font-face { font-family: "Big Shoulders Display"; src: url("fonts/BigShoulders-600.woff2") format("woff2"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Limelight"; src: url("fonts/Limelight-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Josefin Sans"; src: url("fonts/JosefinSans-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #03050b; }
      #gl, #ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .font-warm { position: absolute; left: 0; top: 0; opacity: 0.01; font-size: 20px; color: #03050b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="79.22" data-width="1920" data-height="1080">
      <canvas id="gl" width="1920" height="1080" data-layout-ignore></canvas>
      <canvas id="ov" width="1920" height="1080" data-layout-ignore></canvas>
      <div class="font-warm" data-layout-ignore>
        <span style="font-family: 'Big Shoulders Display'; font-weight: 900">MIRROR 0123456789</span>
        <span style="font-family: 'Big Shoulders Display'; font-weight: 600">MIRROR</span>
        <span style="font-family: 'Limelight'">MIRROR AJQK10</span>
        <span style="font-family: 'Josefin Sans'; font-weight: 700">MIRROR</span>
      </div>
      <audio id="song" src="assets/song.wav" data-start="0" data-duration="79.22" data-track-index="0" data-volume="1"></audio>
    </div>
    <script src="js/song.js"></script>
    <script src="js/util.js"></script>
    <script src="js/textures.js"></script>
    <script src="js/jester.js"></script>
    <script src="js/reflector.js"></script>
    <script src="js/stage.js"></script>
    <script src="js/overlay.js"></script>
    <script src="js/shots.js"></script>
    <script src="js/main.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      MV.attachTimeline(tl);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
